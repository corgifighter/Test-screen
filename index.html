x solid var(--line);border-radius:9px;background:#0c1110dd;color:var(--gold);font:700 9px system-ui;letter-spacing:.12em;padding:9px 11px}#cinematic{position:fixed;right:18px;bottom:18px;z-index:20;pointer-events:auto;border:1px solid var(--line);border-radius:9px;background:#0c1110dd;color:var(--gold);font:700 9px system-ui;letter-spacing:.12em;padding:9px 11px}.cinematic #scene{opacity:1}#capture{position:fixed;right:126px;bottom:18px;z-index:20;pointer-events:auto;border:1px solid var(--line);border-radius:9px;background:#0c1110dd;color:var(--gold);font:700 9px system-ui;letter-spacing:.12em;padding:9px 11px}#cinematic{position:fixed;right:18px;bottom:18px;z-index:20;pointer-events:auto;border:1px solid var(--line);border-radius:9px;background:#0c1110dd;color:var(--gold);font:700 9px system-ui;letter-spacing:.12em;padding:9px 11px}.toast{position:absolute;left:50%;bottom:112px;transform:translate(-50%,14px);opacity:0;transition:.2s;padding:9px 13px;border:1px solid var(--line);border-radius:9px;background:#0c1110e8;font-size:10px;box-shadow:0 12px 30px #0008}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:700px){.top{left:10px;right:10px;top:9px}.title{font-size:16px}.crest{width:36px;height:36px}.stat{width:105px}.quest{left:10px;top:58px;width:220px}.bottom{left:10px;right:10px;bottom:9px;justify-content:center}.panel{width:280px}.bar{gap:4px;padding:5px}.slot{width:41px;height:41px}}@media(max-width:480px){.bars .stat:nth-child(2){display:none}.panel{position:absolute;left:50%;transform:translateX(-50%);bottom:60px}.slot:nth-child(n+7){display:none}}
